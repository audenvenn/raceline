name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install numpy pillow
      - name: Byte-compile all Python sources
        run: python -m compileall -q raceline tools tests bench
      - name: Runtime tests (no GPU, no model)
        run: python tests/test_runtime.py
      - name: Agent tasks are solvable and checked fairly
        run: python tests/test_agent_tasks.py
      - name: OpenAI-compatible server against a scripted runtime
        run: python tests/test_server.py
      - name: Repository contains English only
        run: python tools/check_english.py
