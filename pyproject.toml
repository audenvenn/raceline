[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redline-agent"
version = "0.1.0"
description = "A local agent runtime for Apple Silicon: OpenAI-compatible server and terminal agent on MLX or the redline engine."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["mlx-lm>=0.32", "numpy"]

[project.scripts]
redline = "redline.cli:main"

[tool.setuptools]
packages = ["redline"]
